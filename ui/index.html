<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NATS</title>
    <style>
      /* DBX injects its design tokens and the dbx-* UI kit; fallbacks keep the page usable standalone. */
      :root {
        --fg: var(--color-foreground, #18181b);
        --bg: var(--color-background, #fff);
        --muted: var(--color-muted, #f4f4f5);
        --muted-fg: var(--color-muted-foreground, #52525b);
        --border: var(--color-border, #e4e4e7);
        --primary: var(--color-primary, #4f46e5);
        --danger: var(--color-destructive, #b91c1c);
        --success: var(--color-success, #15803d);
        --radius: var(--radius-md, 8px);
        font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif);
        font-variant-numeric: tabular-nums;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-size: 13px; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
      header h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .meta { color: var(--muted-fg); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
      nav button { border: 0; background: none; color: var(--muted-fg); padding: 10px 12px; font: inherit; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
      nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--primary); }
      nav button:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
      main { padding: 16px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .stat { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); }
      .stat .label { color: var(--muted-fg); font-size: 12px; }
      .stat .value { font-size: 20px; font-weight: 600; margin-top: 4px; }
      .stat .sub { color: var(--muted-fg); font-size: 12px; margin-top: 2px; }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
      dt { color: var(--muted-fg); }
      dd { margin: 0; font-family: var(--font-mono, ui-monospace, monospace); overflow-wrap: anywhere; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .toolbar .grow { flex: 1; min-width: 180px; }
      .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
      @media (min-width: 900px) { .split.two { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
      .scroll { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      th { position: sticky; top: 0; background: var(--muted); color: var(--muted-fg); font-weight: 500; font-size: 12px; }
      td.num, th.num { text-align: right; }
      td.wrap { white-space: normal; overflow-wrap: anywhere; }
      tr[tabindex] { cursor: pointer; }
      tr[tabindex]:hover, tr[aria-selected="true"] { background: var(--muted); }
      code, pre, .mono { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
      pre { margin: 0; padding: 10px; background: var(--muted); border-radius: var(--radius); overflow: auto; max-height: 320px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .msg { padding: 10px; border-bottom: 1px solid var(--border); }
      .msg header { padding: 0 0 6px; border: 0; gap: 6px 12px; }
      .msg header strong { font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
      .empty { padding: 32px 16px; text-align: center; color: var(--muted-fg); }
      .error { padding: 8px 12px; border-radius: var(--radius); color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); margin-bottom: 12px; }
      .ok { color: var(--success); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--border); border-radius: 999px; }
      .chip button { border: 0; background: none; color: var(--muted-fg); cursor: pointer; font: inherit; padding: 0 6px; border-radius: 999px; }
      .chip button:hover { color: var(--danger); }
      .form { display: grid; gap: 10px; max-width: 720px; }
      .form .row { display: grid; gap: 10px; grid-template-columns: 1fr; }
      @media (min-width: 640px) { .form .row { grid-template-columns: 2fr 1fr; } }
      label.field { display: grid; gap: 4px; }
      label.field span { font-weight: 500; }
      .hint { color: var(--muted-fg); font-size: 12px; }
      [hidden] { display: none !important; }
      /* Fallbacks for the DBX UI kit; :where() keeps zero specificity so the host kit wins when present. */
      :where(.dbx-input, .dbx-textarea) { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; min-height: 32px; width: 100%; }
      :where(.dbx-textarea) { resize: vertical; }
      :where(.dbx-btn) { font: inherit; font-weight: 500; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; min-height: 32px; cursor: pointer; white-space: nowrap; }
      :where(.dbx-btn:hover) { background: var(--muted); }
      :where(.dbx-btn:disabled) { opacity: .55; cursor: default; }
      :where(.dbx-btn--primary) { background: var(--primary); border-color: var(--primary); color: var(--color-primary-foreground, #fff); }
      :where(.dbx-btn--primary:hover) { background: var(--primary); filter: brightness(1.08); }
      :where(.dbx-btn--ghost) { border-color: transparent; background: transparent; }
      :where(.dbx-badge) { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); font-size: 12px; }
      :where(.dbx-card) { border: 1px solid var(--border); border-radius: var(--radius); }
      :where(.dbx-section-title) { font-weight: 600; }
      .toolbar .grow.dbx-input { width: auto; }
      .sub-line { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--muted-fg); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">NATS</h1>
      <div class="meta" id="meta"></div>
    </header>
    <nav role="tablist" aria-label="NATS views" id="tabs"></nav>
    <main id="view" aria-live="polite"></main>

    <script>
      "use strict";
      const plugin = window.dbxPlugin;
      const view = document.getElementById("view");
      const TABS = [
        ["overview", "Overview"],
        ["streams", "Streams"],
        ["kv", "Key-Value"],
        ["publish", "Publish"],
        ["subscribe", "Subscribe"],
      ];
      const MAX_LIVE = 500;
      const state = { tab: "overview", connectionId: "", subs: new Map(), paused: false, live: [], dropped: 0 };

      // ---------- tiny DOM helpers (textContent only: server data is untrusted) ----------
      function h(tag, attrs, ...children) {
        const el = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs || {})) {
          if (value == null || value === false) continue;
          if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
          else if (key === "class") el.className = value;
          else el.setAttribute(key, value === true ? "" : value);
        }
        for (const child of children.flat()) {
          if (child == null || child === false) continue;
          el.append(child instanceof Node ? child : String(child));
        }
        return el;
      }
      const render = (...nodes) => view.replaceChildren(...nodes);
      const empty = (text) => h("div", { class: "empty" }, text);
      const errorBox = (err) => h("div", { class: "error", role: "alert" }, err?.message || String(err));
      const badge = (text) => h("span", { class: "dbx-badge" }, text);
      const button = (label, onclick, variant = "", attrs = {}) =>
        h("button", { type: "button", class: `dbx-btn ${variant}`.trim(), onclick, ...attrs }, label);

      const fmtNum = (n) => Number(n || 0).toLocaleString();
      function fmtBytes(n) {
        n = Number(n || 0);
        if (n < 1024) return `${n} B`;
        const units = ["KB", "MB", "GB", "TB"];
        let i = -1;
        do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
        return `${n.toFixed(n < 10 ? 2 : 1)} ${units[i]}`;
      }
      const fmtTime = (t) => (t ? new Date(t).toLocaleString() : "—");
      function payloadText(p) {
        if (p.encoding === "base64") return `[binary, ${fmtBytes(p.size)}] base64:\n${p.data}`;
        let text = p.data;
        try { text = JSON.stringify(JSON.parse(p.data), null, 2); } catch { /* not JSON */ }
        return p.truncated ? `${text}\n… truncated (${fmtBytes(p.size)} total)` : text;
      }
      function headersNode(headers) {
        if (!headers || !Object.keys(headers).length) return null;
        return h("div", { class: "hint mono" }, Object.entries(headers).map(([k, v]) => `${k}: ${v}`).join("  ·  "));
      }
      const invoke = (method, params = {}, timeoutMs = 20000) =>
        plugin.invoke(method, { connectionId: state.connectionId, ...params }, { timeoutMs });

      // Keyboard-accessible clickable table row.
      function clickableRow(cells, onSelect, selected) {
        const row = h("tr", { tabindex: "0", "aria-selected": selected ? "true" : "false", onclick: onSelect,
          onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(); } } }, cells);
        return row;
      }

      // ---------- tabs ----------
      function renderTabs() {
        const nav = document.getElementById("tabs");
        nav.replaceChildren(...TABS.map(([id, label]) =>
          h("button", { role: "tab", type: "button", "aria-selected": String(state.tab === id), onclick: () => show(id) }, label)));
      }
      function show(tab) {
        state.tab = tab;
        renderTabs();
        if (!state.connectionId) {
          render(empty("Open a saved NATS connection from the sidebar to use this workbench."));
          return;
        }
        ({ overview, streams, kv, publish, subscribe })[tab]();
      }

      // ---------- overview ----------
      async function overview() {
        render(empty("Loading server information…"));
        try {
          const o = await invoke("nats/overview");
          const s = o.server;
          document.getElementById("title").textContent = s.name || "NATS";
          document.getElementById("meta").replaceChildren(...[
            h("span", null, `v${s.version}`), s.cluster && badge(`cluster ${s.cluster}`),
            badge(o.jetstream ? "JetStream" : "no JetStream"), s.tls && badge("TLS"), h("span", null, `${s.rttMs.toFixed(1)} ms RTT`),
          ].filter(Boolean));
          const js = o.jetstream;
          const limit = (used, max) => (max > 0 ? `of ${fmtBytes(max)}` : "no account limit");
          render(
            js ? h("div", { class: "grid", style: "margin-bottom:16px" },
              stat("Streams", fmtNum(js.streams)), stat("Consumers", fmtNum(js.consumers)),
              stat("Storage used", fmtBytes(js.storage), limit(js.storage, js.maxStore)),
              stat("Memory used", fmtBytes(js.memory), limit(js.memory, js.maxMemory)))
              : h("p", { class: "hint" }, "JetStream is not enabled for this account: streams and key-value buckets are unavailable."),
            h("section", { class: "dbx-card", style: "padding:16px" },
              h("dl", null,
                h("dt", null, "Server"), h("dd", null, s.name),
                h("dt", null, "Server ID"), h("dd", null, s.id),
                h("dt", null, "URL"), h("dd", null, s.url),
                h("dt", null, "Version"), h("dd", null, s.version),
                h("dt", null, "Max payload"), h("dd", null, fmtBytes(s.maxPayload)),
                h("dt", null, "Headers"), h("dd", null, s.headers ? "supported" : "not supported"))));
        } catch (err) { render(errorBox(err)); }
      }
      const stat = (label, value, sub) => h("div", { class: "stat" },
        h("div", { class: "label" }, label), h("div", { class: "value" }, value), sub && h("div", { class: "sub" }, sub));

      // ---------- streams ----------
      async function streams() {
        render(empty("Loading streams…"));
        let list;
        try { list = (await invoke("nats/streams")).streams; } catch (err) { return render(errorBox(err)); }
        if (!list.length) return render(empty("No streams on this server."));
        list.sort((a, b) => a.name.localeCompare(b.name));
        let selected = null;
        const search = h("input", { class: "dbx-input grow", type: "search", placeholder: "Filter by name or subject…", "aria-label": "Filter streams" });
        const count = h("span", { class: "hint" });
        const body = h("tbody");
        const detail = h("div", null, empty("Select a stream to browse its messages."));
        const draw = () => {
          const q = search.value.toLowerCase();
          const rows = list.filter((s) => s.name.toLowerCase().includes(q) || (s.subjects || []).some((x) => x.toLowerCase().includes(q)));
          count.textContent = q ? `${rows.length} of ${list.length}` : `${list.length} streams`;
          body.replaceChildren(...rows.map((s) => clickableRow([
            h("td", { style: "max-width:0;width:100%" },
              h("strong", null, s.name), " ", h("span", { class: "hint" }, `${s.retention} · ${s.consumers} consumers`),
              h("code", { class: "sub-line", title: (s.subjects || []).join(", ") }, (s.subjects || []).join(", ") || "no subjects")),
            h("td", { class: "num" }, fmtNum(s.messages)),
            h("td", { class: "num" }, fmtBytes(s.bytes)),
          ], () => { selected = s.name; draw(); streamMessages(s, detail); }, selected === s.name)));
        };
        search.addEventListener("input", draw);
        draw();
        render(h("div", { class: "toolbar" }, search, count, button("Refresh", streams, "dbx-btn--ghost")),
          h("div", { class: "split two" },
            h("div", { class: "scroll" }, h("table", { class: "dbx-table" },
              h("thead", null, h("tr", null, h("th", null, "Stream"),
                h("th", { class: "num" }, "Messages"), h("th", { class: "num" }, "Size"))), body)),
            detail));
      }

      async function streamMessages(stream, container, before = 0, list = null) {
        if (!list) {
          list = h("div", { class: "scroll" });
          container.replaceChildren(h("div", { class: "dbx-section-title", style: "margin-bottom:8px" },
            `${stream.name} · ${fmtNum(stream.messages)} messages, newest first`), list);
        }
        const more = list.querySelector(".more");
        if (more) more.remove();
        const loading = empty("Loading messages…");
        list.append(loading);
        try {
          const page = await invoke("nats/streamMessages", { stream: stream.name, before, limit: 50 }, 30000);
          loading.remove();
          if (!page.messages.length && !before) list.append(empty("This stream has no messages."));
          for (const m of page.messages) {
            list.append(h("div", { class: "msg" },
              h("header", null, h("strong", null, `#${m.seq}`), h("code", null, m.subject),
                h("span", { class: "hint" }, fmtTime(m.time)), h("span", { class: "hint" }, fmtBytes(m.size))),
              headersNode(m.headers), h("pre", null, payloadText(m))));
          }
          if (page.nextBefore) {
            list.append(h("div", { class: "more", style: "padding:10px;text-align:center" },
              button("Load older", () => streamMessages(stream, container, page.nextBefore, list), "dbx-btn--ghost")));
          }
        } catch (err) { loading.remove(); list.append(errorBox(err)); }
      }

      // ---------- key-value ----------
      async function kv() {
        render(empty("Loading buckets…"));
        let buckets;
        try { buckets = (await invoke("nats/kvBuckets")).buckets; } catch (err) { return render(errorBox(err)); }
        if (!buckets.length) return render(empty("No key-value buckets on this server."));
        buckets.sort((a, b) => a.bucket.localeCompare(b.bucket));
        let selected = null;
        const body = h("tbody");
        const detail = h("div", null, empty("Select a bucket to list its keys."));
        const draw = () => body.replaceChildren(...buckets.map((b) => clickableRow([
          h("td", null, h("strong", null, b.bucket), b.compressed ? " " : "", b.compressed && badge("compressed")),
          h("td", { class: "num" }, fmtNum(b.values)), h("td", { class: "num" }, fmtBytes(b.bytes)),
          h("td", { class: "num" }, b.history), h("td", null, b.ttl),
        ], () => { selected = b.bucket; draw(); bucketKeys(b.bucket, detail); }, selected === b.bucket)));
        draw();
        render(h("div", { class: "toolbar" }, h("span", { class: "hint grow" }, `${buckets.length} buckets`), button("Refresh", kv, "dbx-btn--ghost")),
          h("div", { class: "split two" },
            h("div", { class: "scroll" }, h("table", { class: "dbx-table" }, h("thead", null, h("tr", null,
              h("th", null, "Bucket"), h("th", { class: "num" }, "Entries"), h("th", { class: "num" }, "Size"),
              h("th", { class: "num" }, "History"), h("th", null, "TTL"))), body)),
            detail));
      }

      async function bucketKeys(bucket, container) {
        container.replaceChildren(empty("Loading keys…"));
        let result;
        try { result = await invoke("nats/kvKeys", { bucket }); } catch (err) { return container.replaceChildren(errorBox(err)); }
        if (!result.keys.length) return container.replaceChildren(empty("This bucket has no keys."));
        const keys = result.keys.sort();
        const filter = h("input", { class: "dbx-input grow", type: "search", placeholder: "Filter keys…", "aria-label": "Filter keys" });
        const list = h("tbody");
        const value = h("div", null, empty("Select a key to see its value."));
        let selected = null;
        const draw = () => {
          const q = filter.value.toLowerCase();
          list.replaceChildren(...keys.filter((k) => k.toLowerCase().includes(q)).map((k) =>
            clickableRow([h("td", { class: "wrap mono" }, k)], () => { selected = k; draw(); keyValue(bucket, k, value); }, selected === k)));
        };
        filter.addEventListener("input", draw);
        draw();
        container.replaceChildren(
          h("div", { class: "toolbar" }, filter, h("span", { class: "hint" }, result.truncated ? `first ${keys.length} keys` : `${keys.length} keys`)),
          h("div", { class: "scroll", style: "max-height:30vh;margin-bottom:12px" }, h("table", { class: "dbx-table" }, list)),
          value);
      }

      async function keyValue(bucket, key, container) {
        container.replaceChildren(empty("Loading value…"));
        try {
          const v = await invoke("nats/kvGet", { bucket, key });
          container.replaceChildren(
            h("div", { class: "toolbar" }, h("code", null, v.key), badge(`rev ${v.revision}`), badge(v.operation),
              h("span", { class: "hint" }, fmtTime(v.created)), h("span", { class: "hint" }, fmtBytes(v.size))),
            h("pre", null, payloadText(v)));
        } catch (err) { container.replaceChildren(errorBox(err)); }
      }

      // ---------- publish / request ----------
      function parseHeaders(text) {
        const out = {};
        for (const line of text.split("\n")) {
          const i = line.indexOf(":");
          if (i > 0) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
        }
        return out;
      }
      function field(label, control, hint) {
        return h("label", { class: "field" }, h("span", null, label), control, hint && h("span", { class: "hint" }, hint));
      }
      function publish() {
        const subject = h("input", { class: "dbx-input", placeholder: "orders.created", required: true, spellcheck: "false" });
        const timeout = h("input", { class: "dbx-input", type: "number", min: "1", max: "60", value: "5" });
        const headers = h("textarea", { class: "dbx-textarea", rows: "2", placeholder: "X-Trace-Id: 123", spellcheck: "false" });
        const data = h("textarea", { class: "dbx-textarea mono", rows: "8", placeholder: '{"id": 1}', spellcheck: "false" });
        const result = h("div", { "aria-live": "polite" });
        const run = async (kind, btn) => {
          btn.disabled = true;
          result.replaceChildren();
          try {
            const params = { subject: subject.value.trim(), data: data.value, headers: parseHeaders(headers.value) };
            if (kind === "publish") {
              await invoke("nats/publish", params);
              result.replaceChildren(h("p", { class: "ok" }, `Published to ${params.subject} at ${new Date().toLocaleTimeString()}.`));
            } else {
              const secs = Math.min(60, Math.max(1, Number(timeout.value) || 5));
              const reply = await invoke("nats/request", { ...params, timeoutMs: secs * 1000 }, secs * 1000 + 5000);
              result.replaceChildren(h("div", { class: "toolbar" }, h("strong", null, "Reply"),
                h("span", { class: "hint" }, `${reply.elapsedMs.toFixed(1)} ms · ${fmtBytes(reply.size)}`)),
                headersNode(reply.headers), h("pre", null, payloadText(reply)));
            }
          } catch (err) { result.replaceChildren(errorBox(err)); } finally { btn.disabled = false; }
        };
        const pubBtn = button("Publish", () => run("publish", pubBtn), "dbx-btn--primary");
        const reqBtn = button("Send request", () => run("request", reqBtn));
        // The workbench iframe is sandboxed without allow-forms: no <form> submission, use click/Enter handlers.
        subject.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run("publish", pubBtn); } });
        render(h("div", { class: "form" },
          h("div", { class: "row" }, field("Subject", subject, "Wildcards are not allowed when publishing."),
            field("Request timeout (s)", timeout, "Used by Send request.")),
          field("Headers", headers, "One Key: value per line (optional)."),
          field("Payload", data),
          h("div", { class: "toolbar" }, pubBtn, reqBtn), result));
      }

      // ---------- live subscriptions ----------
      const log = h("div", { class: "scroll", style: "max-height:60vh" });
      const liveStatus = h("span", { class: "hint", "aria-live": "polite" });
      function subscribe() {
        const subject = h("input", { class: "dbx-input grow", placeholder: "orders.> or events.*", spellcheck: "false", "aria-label": "Subject" });
        const queue = h("input", { class: "dbx-input", placeholder: "queue group (optional)", spellcheck: "false", "aria-label": "Queue group", style: "max-width:200px" });
        const chips = h("div", { class: "chips" });
        const error = h("div");
        for (const input of [subject, queue]) {
          input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
        }
        const add = async () => {
          error.replaceChildren();
          const s = subject.value.trim();
          if (!s) return;
          try {
            const { subscriptionId } = await invoke("nats/subscribe", { subject: s, queue: queue.value.trim() });
            state.subs.set(subscriptionId, { subject: s, queue: queue.value.trim(), count: 0 });
            subject.value = "";
            drawChips(chips);
          } catch (err) { error.replaceChildren(errorBox(err)); }
        };
        const pause = button(state.paused ? "Resume" : "Pause", () => {
          state.paused = !state.paused; pause.textContent = state.paused ? "Resume" : "Pause"; drawLog();
        }, "dbx-btn--ghost", { "aria-pressed": String(state.paused) });
        drawChips(chips);
        drawLog();
        render(
          h("div", { class: "toolbar" },
            subject, queue, button("Subscribe", add, "dbx-btn--primary")),
          error, chips,
          h("div", { class: "toolbar" }, liveStatus, h("span", { class: "grow" }), pause,
            button("Clear", () => { state.live = []; state.dropped = 0; drawLog(); }, "dbx-btn--ghost")),
          log);
      }
      function drawChips(chips) {
        if (!state.subs.size) return chips.replaceChildren(h("span", { class: "hint" }, "No active subscriptions. Wildcards like orders.* and events.> work."));
        chips.replaceChildren(...[...state.subs].map(([id, s]) => h("span", { class: "chip" },
          h("code", null, s.queue ? `${s.subject} (${s.queue})` : s.subject), h("span", { class: "hint" }, fmtNum(s.count)),
          h("button", { type: "button", "aria-label": `Stop ${s.subject}`, title: "Stop", onclick: async () => {
            try { await invoke("nats/unsubscribe", { subscriptionId: id }); } catch { /* already gone */ }
            state.subs.delete(id); drawChips(chips);
          } }, "×"))));
      }
      function drawLog() {
        liveStatus.textContent = `${fmtNum(state.live.length)} shown (last ${MAX_LIVE})` +
          (state.dropped ? ` · ${fmtNum(state.dropped)} dropped by the 100 msg/s limit` : "") + (state.paused ? " · paused" : "");
        if (state.paused) return;
        if (!state.live.length) return log.replaceChildren(empty("Messages appear here as they arrive."));
        log.replaceChildren(...state.live.map((m) => h("div", { class: "msg" },
          h("header", null, h("strong", null, m.subject), m.reply && h("span", { class: "hint mono" }, `reply → ${m.reply}`),
            h("span", { class: "hint" }, new Date(m.receivedAt).toLocaleTimeString()), h("span", { class: "hint" }, fmtBytes(m.size))),
          headersNode(m.headers), h("pre", null, payloadText(m)))));
      }
      let drawQueued = false;
      plugin.onEvent?.((event) => {
        const p = event.params || {};
        if (p.connectionId && p.connectionId !== state.connectionId) return;
        if (event.method === "nats/message") {
          const sub = state.subs.get(p.subscriptionId);
          if (sub) sub.count++;
          state.dropped += p.dropped || 0;
          if (state.paused) return;
          state.live.unshift(p);
          if (state.live.length > MAX_LIVE) state.live.length = MAX_LIVE;
          // Batch redraws: bursts arrive at up to 100 msg/s per subscription.
          if (state.tab === "subscribe" && !drawQueued) {
            drawQueued = true;
            requestAnimationFrame(() => { drawQueued = false; drawLog(); const c = view.querySelector(".chips"); if (c) drawChips(c); });
          }
        } else if (event.method === "nats/subscriptionClosed") {
          state.subs.delete(p.subscriptionId);
          const c = view.querySelector(".chips"); if (c && state.tab === "subscribe") drawChips(c);
        } else if (event.method === "nats/connectionChanged" && p.state === "disconnected") {
          state.subs.clear();
        }
      });

      async function stopAll() {
        const ids = [...state.subs.keys()];
        state.subs.clear();
        await Promise.allSettled(ids.map((id) => invoke("nats/unsubscribe", { subscriptionId: id })));
      }
      window.addEventListener("pagehide", stopAll);

      // ---------- boot ----------
      let booted = false;
      function applyContext(context) {
        const next = context?.connectionId || "";
        if (booted && next === state.connectionId) return;
        booted = true;
        if (state.connectionId) stopAll();
        state.connectionId = next;
        state.live = []; state.dropped = 0;
        show(state.tab);
      }
      if (!plugin) {
        render(empty("This page must be opened inside DBX."));
      } else {
        renderTabs();
        plugin.ready.then((context) => {
          applyContext(context || plugin.context);
          plugin.onContext?.(applyContext);
        });
      }
    </script>
  </body>
</html>
