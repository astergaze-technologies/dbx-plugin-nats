name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match manifest.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="v$(jq -r .version manifest.json)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::release tag $TAG does not match manifest.json version $want"
            exit 1
          fi

  release:
    needs: version
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci --prefix frontend && npm --prefix frontend run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      go-version: "1.26"
